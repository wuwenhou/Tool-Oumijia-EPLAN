name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Tool-Oumijia-EPLAN.sln

      - name: Build
        run: dotnet build Tool-Oumijia-EPLAN.sln -c Release --no-restore

      - name: Test
        run: dotnet test Tool-Oumijia-EPLAN.sln -c Release --no-build --verbosity normal

      - name: Pack (sanity check)
        run: powershell -ExecutionPolicy Bypass -File tools/pack.ps1 -Version 0.0.0-ci -FrameworkDependent
        shell: pwsh
